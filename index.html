<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08080c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dyl's Six Pack Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #08080c;
            color: white;
        }

        .app {
            width: 100%;
            max-width: 450px;
            margin: auto;
            padding: 45px 20px 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .purple {
            color: #a855f7;
        }

        .date {
            margin-top: 8px;
            color: #888;
            font-size: 15px;
        }

        /* TOP NAVIGATION */

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: #121218;
            border: 1px solid #24242d;
            border-radius: 14px;
            padding: 5px;
            margin-bottom: 20px;
        }

        .tab-button {
            border: none;
            border-radius: 10px;
            padding: 13px 10px;
            background: transparent;
            color: #777;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .tab-button.active {
            background: #a855f7;
            color: white;
        }

        .tab-button:active {
            transform: scale(0.98);
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .card {
            background: #121218;
            border: 1px solid #24242d;
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 18px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 8px;
        }

        select,
        input {
            width: 100%;
            padding: 16px;
            margin-bottom: 16px;
            background: #08080c;
            color: white;
            border: 1px solid #30303a;
            border-radius: 12px;
            font-size: 17px;
            outline: none;
        }

        select:focus,
        input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.15);
        }

        input::placeholder {
            color: #555;
        }

        .meal-info,
        .drink-info {
            background: #1a1222;
            border: 1px solid #39204d;
            border-radius: 12px;
            padding: 12px;
            margin-top: -5px;
            margin-bottom: 16px;
            color: #c084fc;
            font-size: 14px;
            display: none;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 5px 0 20px;
            color: #555;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #292930;
        }

        .add-button {
            width: 100%;
            padding: 17px;
            border: none;
            border-radius: 12px;
            background: #a855f7;
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }

        .add-button:active {
            transform: scale(0.98);
        }

        .week-button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid #a855f7;
            border-radius: 12px;
            background: #1a1222;
            color: #c084fc;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .week-button:active {
            transform: scale(0.98);
        }

        .week-button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .reset-button {
            width: 100%;
            margin-top: 15px;
            padding: 13px;
            border: 1px solid #30303a;
            border-radius: 12px;
            background: transparent;
            color: #777;
            font-size: 14px;
            cursor: pointer;
        }

        .reset-button:active {
            background: #18181f;
        }

        .totals {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .total-box {
            background: #08080c;
            border: 1px solid #24242d;
            border-radius: 15px;
            padding: 18px 12px;
            text-align: center;
        }

        .total-label {
            color: #888;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .total-number {
            font-size: 25px;
            font-weight: 800;
        }

        .total-unit {
            font-size: 12px;
            color: #888;
            margin-left: 2px;
        }

        .protein-number {
            color: #c084fc;
        }

        .week-target {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-top: -12px;
            margin-bottom: 20px;
        }

        .week-total {
            background: #08080c;
            border: 1px solid #24242d;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 12px;
        }

        .week-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .week-row:last-child {
            margin-bottom: 0;
        }

        .week-label {
            color: #aaa;
            font-size: 14px;
            font-weight: 600;
        }

        .week-value {
            font-size: 18px;
            font-weight: 800;
        }

        .week-progress {
            width: 100%;
            height: 8px;
            background: #24242d;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 8px;
        }

        .week-progress-bar {
            height: 100%;
            width: 0%;
            background: #a855f7;
            border-radius: 20px;
            transition: width 0.3s ease;
        }

        .remaining {
            text-align: center;
            margin-top: 15px;
            color: #888;
            font-size: 14px;
            line-height: 1.7;
        }

        .over {
            color: #ff5c5c;
            font-weight: 700;
        }

        .footer {
            text-align: center;
            color: #444;
            font-size: 12px;
            margin-top: 25px;
        }

        /* GRAPHS PLACEHOLDER */

        .graphs-placeholder {
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #444;
            font-size: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <h1>Dyl's <span class="purple">Six Pack</span> Tracker</h1>
        <div class="date" id="date"></div>
    </div>


    <!-- TOP TABS -->

    <div class="tabs">

        <button
            class="tab-button active"
            id="mainTab"
            onclick="showPage('main')"
        >
            Main
        </button>

        <button
            class="tab-button"
            id="graphsTab"
            onclick="showPage('graphs')"
        >
            Graphs
        </button>

    </div>


    <!-- ========================= -->
    <!-- MAIN PAGE                  -->
    <!-- ========================= -->

    <div id="mainPage" class="page active">


        <div class="card">

            <div class="card-title">
                Add Food
            </div>


            <label for="savedMeal">
                Meals
            </label>


            <select
                id="savedMeal"
                onchange="mealSelected()"
            >

                <option value="">
                    Choose a meal...
                </option>

                <option value="mcdees">
                    Mcdees 2x Double Burger
                </option>

                <option value="bigmac">
                    Big Mac Meal
                </option>

                <option value="wimpy">
                    Wimpy Burger Meal
                </option>

                <option value="usn1">
                    USN Choc Caramel 1 Scoop
                </option>

                <option value="usn2">
                    USN Choc Caramel 2 Scoop
                </option>

            </select>


            <div
                class="meal-info"
                id="mealInfo"
            ></div>


            <label for="drink">
                Drinks
            </label>


            <select
                id="drink"
                onchange="drinkSelected()"
            >

                <option value="">
                    Choose a drink...
                </option>

                <option value="vodka">
                    Single Vodka with Zero Mix
                </option>

                <option value="jager">
                    Jägermeister Shot
                </option>

            </select>


            <div
                class="drink-info"
                id="drinkInfo"
            ></div>


            <label for="quantity">
                Quantity
            </label>


            <input
                type="number"
                id="quantity"
                value="1"
                min="1"
                step="1"
                inputmode="numeric"
            >


            <div class="divider">
                OR ENTER MANUALLY
            </div>


            <label for="calories">
                Calories
            </label>


            <input
                type="number"
                id="calories"
                placeholder="0"
                min="0"
                inputmode="decimal"
            >


            <label for="protein">
                Protein (g)
            </label>


            <input
                type="number"
                id="protein"
                placeholder="0"
                min="0"
                step="0.1"
                inputmode="decimal"
            >


            <button
                class="add-button"
                onclick="addFood()"
            >
                + Add Food
            </button>

        </div>


        <!-- TODAY'S TOTAL -->

        <div class="card">

            <div class="card-title">
                Today's Total
            </div>


            <div class="totals">

                <div class="total-box">

                    <div class="total-label">
                        Calories
                    </div>

                    <div
                        class="total-number"
                        id="totalCalories"
                    >
                        0
                    </div>

                    <span class="total-unit">
                        kcal
                    </span>

                </div>


                <div class="total-box">

                    <div class="total-label">
                        Protein
                    </div>

                    <div
                        class="total-number protein-number"
                        id="totalProtein"
                    >
                        0
                    </div>

                    <span class="total-unit">
                        g
                    </span>

                </div>

            </div>


            <button
                class="week-button"
                id="addWeekButton"
                onclick="addTodayToWeek()"
            >
                + Add Today to Week
            </button>


            <button
                class="reset-button"
                onclick="resetDay()"
            >
                Reset Today
            </button>

        </div>


        <!-- WEEK -->

        <div class="card">

            <div class="card-title">
                This Week
            </div>


            <div class="week-target">
                Weekly target: 16,800 kcal • 1,120g protein
            </div>


            <div class="week-total">

                <div class="week-row">

                    <span class="week-label">
                        Calories
                    </span>

                    <span
                        class="week-value"
                        id="weekCalories"
                    >
                        0 / 16,800
                    </span>

                </div>


                <div class="week-progress">

                    <div
                        class="week-progress-bar"
                        id="calorieBar"
                    ></div>

                </div>

            </div>


            <div class="week-total">

                <div class="week-row">

                    <span class="week-label">
                        Protein
                    </span>

                    <span
                        class="week-value"
                        id="weekProtein"
                    >
                        0 / 1,120 g
                    </span>

                </div>


                <div class="week-progress">

                    <div
                        class="week-progress-bar"
                        id="proteinBar"
                    ></div>

                </div>

            </div>


            <div
                class="remaining"
                id="remaining"
            ></div>


            <button
                class="reset-button"
                onclick="resetWeek()"
            >
                Reset Week
            </button>

        </div>


        <div class="footer">
            Stay consistent. 💪
        </div>

    </div>


    <!-- ========================= -->
    <!-- GRAPHS PAGE                -->
    <!-- ========================= -->

    <div
        id="graphsPage"
        class="page"
    >

        <div class="card">

            <div class="graphs-placeholder">
                Graphs coming soon...
            </div>

        </div>

    </div>

</div>


<script>

const WEEK_CALORIE_TARGET = 16800;
const WEEK_PROTEIN_TARGET = 1120;


const meals = {

    mcdees: {
        name: "Mcdees 2x Double Burger",
        calories: 630,
        protein: 37
    },

    bigmac: {
        name: "Big Mac Meal",
        calories: 650,
        protein: 25
    },

    wimpy: {
        name: "Wimpy Burger Meal",
        calories: 700,
        protein: 30
    },

    usn1: {
        name: "USN Choc Caramel 1 Scoop",
        calories: 121,
        protein: 23
    },

    usn2: {
        name: "USN Choc Caramel 2 Scoop",
        calories: 242,
        protein: 46
    }

};


const drinks = {

    vodka: {
        name: "Single Vodka with Zero Mix",
        calories: 55,
        protein: 0
    },

    jager: {
        name: "Jägermeister Shot",
        calories: 55,
        protein: 0
    }

};


/* ========================= */
/* TAB SWITCHING              */
/* ========================= */

function showPage(page) {

    const mainPage =
        document.getElementById("mainPage");

    const graphsPage =
        document.getElementById("graphsPage");

    const mainTab =
        document.getElementById("mainTab");

    const graphsTab =
        document.getElementById("graphsTab");


    if (page === "main") {

        mainPage.classList.add("active");
        graphsPage.classList.remove("active");

        mainTab.classList.add("active");
        graphsTab.classList.remove("active");

    } else {

        mainPage.classList.remove("active");
        graphsPage.classList.add("active");

        mainTab.classList.remove("active");
        graphsTab.classList.add("active");

    }

}


/* ========================= */
/* DATE / WEEK               */
/* ========================= */

function getToday() {

    const today = new Date();

    return today.getFullYear() + "-" +
        (today.getMonth() + 1) + "-" +
        today.getDate();

}


function getWeekID() {

    const today = new Date();

    const date = new Date(Date.UTC(
        today.getFullYear(),
        today.getMonth(),
        today.getDate()
    ));

    const day = date.getUTCDay();

    const diff =
        day === 0
            ? -6
            : 1 - day;

    date.setUTCDate(
        date.getUTCDate() + diff
    );

    return date.getUTCFullYear() + "-" +
        String(
            date.getUTCMonth() + 1
        ).padStart(2, "0") + "-" +
        String(
            date.getUTCDate()
        ).padStart(2, "0");

}


function checkNewDay() {

    const savedDate =
        localStorage.getItem("date");

    const today =
        getToday();


    if (savedDate !== today) {

        localStorage.setItem(
            "date",
            today
        );

        localStorage.setItem(
            "calories",
            "0"
        );

        localStorage.setItem(
            "protein",
            "0"
        );

    }

}


function checkNewWeek() {

    const currentWeek =
        getWeekID();

    const savedWeek =
        localStorage.getItem("weekID");


    if (savedWeek !== currentWeek) {

        localStorage.setItem(
            "weekID",
            currentWeek
        );

        localStorage.setItem(
            "weekCalories",
            "0"
        );

        localStorage.setItem(
            "weekProtein",
            "0"
        );

        localStorage.setItem(
            "weekAddedDays",
            JSON.stringify([])
        );

    }

}


/* ========================= */
/* LOAD TOTALS               */
/* ========================= */

function loadTotals() {

    checkNewDay();
    checkNewWeek();


    const calories =
        parseFloat(
            localStorage.getItem(
                "calories"
            )
        ) || 0;


    const protein =
        parseFloat(
            localStorage.getItem(
                "protein"
            )
        ) || 0;


    document.getElementById(
        "totalCalories"
    ).textContent = calories;


    document.getElementById(
        "totalProtein"
    ).textContent = protein;


    document.getElementById(
        "date"
    ).textContent =
        new Date().toLocaleDateString(
            undefined,
            {
                weekday: "long",
                month: "long",
                day: "numeric"
            }
        );


    loadWeek();

}


/* ========================= */
/* WEEK                      */
/* ========================= */

function loadWeek() {

    checkNewWeek();


    const calories =
        parseFloat(
            localStorage.getItem(
                "weekCalories"
            )
        ) || 0;


    const protein =
        parseFloat(
            localStorage.getItem(
                "weekProtein"
            )
        ) || 0;


    document.getElementById(
        "weekCalories"
    ).textContent =
        calories.toLocaleString() +
        " / " +
        WEEK_CALORIE_TARGET.toLocaleString();


    document.getElementById(
        "weekProtein"
    ).textContent =
        protein.toLocaleString() +
        " / " +
        WEEK_PROTEIN_TARGET.toLocaleString() +
        " g";


    const caloriePercent =
        Math.min(
            (
                calories /
                WEEK_CALORIE_TARGET
            ) * 100,
            100
        );


    document.getElementById(
        "calorieBar"
    ).style.width =
        caloriePercent + "%";


    const proteinPercent =
        Math.min(
            (
                protein /
                WEEK_PROTEIN_TARGET
            ) * 100,
            100
        );


    document.getElementById(
        "proteinBar"
    ).style.width =
        proteinPercent + "%";


    const calorieRemaining =
        WEEK_CALORIE_TARGET -
        calories;


    const proteinRemaining =
        WEEK_PROTEIN_TARGET -
        protein;


    let message = "";


    if (calorieRemaining >= 0) {

        message +=
            "Calories remaining: " +
            calorieRemaining.toLocaleString() +
            " kcal";

    } else {

        message +=
            '<span class="over">' +
            "Calories over: " +
            Math.abs(
                calorieRemaining
            ).toLocaleString() +
            " kcal" +
            "</span>";

    }


    message += "<br>";


    if (proteinRemaining >= 0) {

        message +=
            "Protein remaining: " +
            proteinRemaining.toLocaleString() +
            " g";

    } else {

        message +=
            '<span class="over">' +
            "Protein over: " +
            Math.abs(
                proteinRemaining
            ).toLocaleString() +
            " g" +
            "</span>";

    }


    document.getElementById(
        "remaining"
    ).innerHTML = message;


    updateWeekButton();

}


/* ========================= */
/* MEAL SELECTION             */
/* ========================= */

function mealSelected() {

    const selected =
        document.getElementById(
            "savedMeal"
        ).value;


    const info =
        document.getElementById(
            "mealInfo"
        );


    if (selected === "") {

        info.style.display = "none";
        info.textContent = "";

        return;

    }


    const meal =
        meals[selected];


    info.textContent =
        meal.calories +
        " kcal • " +
        meal.protein +
        "g protein";


    info.style.display =
        "block";


    document.getElementById(
        "drink"
    ).value = "";


    document.getElementById(
        "drinkInfo"
    ).style.display =
        "none";


    document.getElementById(
        "drinkInfo"
    ).textContent = "";


    document.getElementById(
        "calories"
    ).value = "";


    document.getElementById(
        "protein"
    ).value = "";

}


/* ========================= */
/* DRINK SELECTION            */
/* ========================= */

function drinkSelected() {

    const selected =
        document.getElementById(
            "drink"
        ).value;


    const info =
        document.getElementById(
            "drinkInfo"
        );


    if (selected === "") {

        info.style.display = "none";
        info.textContent = "";

        return;

    }


    const drink =
        drinks[selected];


    info.textContent =
        drink.calories +
        " kcal • " +
        drink.protein +
        "g protein";


    info.style.display =
        "block";


    document.getElementById(
        "savedMeal"
    ).value = "";


    document.getElementById(
        "mealInfo"
    ).style.display =
        "none";


    document.getElementById(
        "mealInfo"
    ).textContent = "";


    document.getElementById(
        "calories"
    ).value = "";


    document.getElementById(
        "protein"
    ).value = "";

}


/* ========================= */
/* ADD FOOD                  */
/* ========================= */

function addFood() {

    checkNewDay();


    const selectedMeal =
        document.getElementById(
            "savedMeal"
        ).value;


    const selectedDrink =
        document.getElementById(
            "drink"
        ).value;


    let calories = 0;
    let protein = 0;


    const quantity =
        parseInt(
            document.getElementById(
                "quantity"
            ).value
        ) || 1;


    if (selectedMeal !== "") {

        const meal =
            meals[selectedMeal];


        calories =
            meal.calories *
            quantity;


        protein =
            meal.protein *
            quantity;


    } else if (selectedDrink !== "") {

        const drink =
            drinks[selectedDrink];


        calories =
            drink.calories *
            quantity;


        protein =
            drink.protein *
            quantity;


    } else {

        calories =
            parseFloat(
                document.getElementById(
                    "calories"
                ).value
            ) || 0;


        protein =
            parseFloat(
                document.getElementById(
                    "protein"
                ).value
            ) || 0;

    }


    if (
        calories === 0 &&
        protein === 0
    ) {

        alert(
            "Please choose a meal, choose a drink, or enter calories and protein."
        );

        return;

    }


    let totalCalories =
        parseFloat(
            localStorage.getItem(
                "calories"
            )
        ) || 0;


    let totalProtein =
        parseFloat(
            localStorage.getItem(
                "protein"
            )
        ) || 0;


    totalCalories += calories;
    totalProtein += protein;


    localStorage.setItem(
        "calories",
        totalCalories
    );


    localStorage.setItem(
        "protein",
        totalProtein
    );


    document.getElementById(
        "savedMeal"
    ).value = "";


    document.getElementById(
        "drink"
    ).value = "";


    document.getElementById(
        "mealInfo"
    ).style.display = "none";


    document.getElementById(
        "drinkInfo"
    ).style.display = "none";


    document.getElementById(
        "mealInfo"
    ).textContent = "";


    document.getElementById(
        "drinkInfo"
    ).textContent = "";


    document.getElementById(
        "quantity"
    ).value = "1";


    document.getElementById(
        "calories"
    ).value = "";


    document.getElementById(
        "protein"
    ).value = "";


    loadTotals();

}


/* ========================= */
/* ADD TODAY TO WEEK         */
/* ========================= */

function addTodayToWeek() {

    checkNewDay();
    checkNewWeek();


    const today =
        getToday();


    let addedDays =
        JSON.parse(
            localStorage.getItem(
                "weekAddedDays"
            )
        ) || [];


    if (
        addedDays.includes(today)
    ) {

        alert(
            "Today has already been added to your week."
        );

        return;

    }


    const todayCalories =
        parseFloat(
            localStorage.getItem(
                "calories"
            )
        ) || 0;


    const todayProtein =
        parseFloat(
            localStorage.getItem(
                "protein"
            )
        ) || 0;


    let weekCalories =
        parseFloat(
            localStorage.getItem(
                "weekCalories"
            )
        ) || 0;


    let weekProtein =
        parseFloat(
            localStorage.getItem(
                "weekProtein"
            )
        ) || 0;


    weekCalories +=
        todayCalories;


    weekProtein +=
        todayProtein;


    localStorage.setItem(
        "weekCalories",
        weekCalories
    );


    localStorage.setItem(
        "weekProtein",
        weekProtein
    );


    addedDays.push(today);


    localStorage.setItem(
        "weekAddedDays",
        JSON.stringify(
            addedDays
        )
    );


    loadWeek();

}


/* ========================= */
/* WEEK BUTTON               */
/* ========================= */

function updateWeekButton() {

    const button =
        document.getElementById(
            "addWeekButton"
        );


    const today =
        getToday();


    const addedDays =
        JSON.parse(
            localStorage.getItem(
                "weekAddedDays"
            )
        ) || [];


    if (
        addedDays.includes(today)
    ) {

        button.textContent =
            "✓ Today Added to Week";

        button.disabled = true;

    } else {

        button.textContent =
            "+ Add Today to Week";

        button.disabled = false;

    }

}


/* ========================= */
/* RESET TODAY               */
/* ========================= */

function resetDay() {

    if (
        confirm(
            "Reset today's calories and protein?"
        )
    ) {

        localStorage.setItem(
            "calories",
            "0"
        );

        localStorage.setItem(
            "protein",
            "0"
        );

        loadTotals();

    }

}


/* ========================= */
/* RESET WEEK                */
/* ========================= */

function resetWeek() {

    if (
        confirm(
            "Reset your entire weekly total?"
        )
    ) {

        localStorage.setItem(
            "weekCalories",
            "0"
        );

        localStorage.setItem(
            "weekProtein",
            "0"
        );

        localStorage.setItem(
            "weekAddedDays",
            JSON.stringify([])
        );

        loadWeek();

    }

}


/* ========================= */
/* START APP                 */
/* ========================= */

loadTotals();

</script>
