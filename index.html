<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08080c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Dyl's Six Pack Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #08080c;
            color: white;
        }

        .app {
            width: 100%;
            max-width: 450px;
            margin: auto;
            padding: 45px 20px 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .purple {
            color: #a855f7;
        }

        .date {
            margin-top: 8px;
            color: #888;
            font-size: 15px;
        }

        .card {
            background: #121218;
            border: 1px solid #24242d;
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 18px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 8px;
        }

        select,
        input {
            width: 100%;
            padding: 16px;
            margin-bottom: 16px;
            background: #08080c;
            color: white;
            border: 1px solid #30303a;
            border-radius: 12px;
            font-size: 17px;
            outline: none;
        }

        select:focus,
        input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.15);
        }

        input::placeholder {
            color: #555;
        }

        .meal-info,
        .drink-info {
            background: #1a1222;
            border: 1px solid #39204d;
            border-radius: 12px;
            padding: 12px;
            margin-top: -5px;
            margin-bottom: 16px;
            color: #c084fc;
            font-size: 14px;
            display: none;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 5px 0 20px;
            color: #555;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #292930;
        }

        .add-button {
            width: 100%;
            padding: 17px;
            border: none;
            border-radius: 12px;
            background: #a855f7;
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }

        .add-button:active {
            transform: scale(0.98);
        }

        .totals {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .total-box {
            background: #08080c;
            border: 1px solid #24242d;
            border-radius: 15px;
            padding: 18px 12px;
            text-align: center;
        }

        .total-label {
            color: #888;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .total-number {
            font-size: 25px;
            font-weight: 800;
        }

        .total-unit {
            font-size: 12px;
            color: #888;
            margin-left: 2px;
        }

        .protein-number {
            color: #c084fc;
        }

        .reset-button {
            width: 100%;
            margin-top: 15px;
            padding: 13px;
            border: 1px solid #30303a;
            border-radius: 12px;
            background: transparent;
            color: #777;
            font-size: 14px;
            cursor: pointer;
        }

        .reset-button:active {
            background: #18181f;
        }

        .footer {
            text-align: center;
            color: #444;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <h1>
            Dyl's <span class="purple">Six Pack</span> Tracker
        </h1>

        <div class="date" id="date"></div>

    </div>


    <!-- ADD FOOD -->

    <div class="card">

        <div class="card-title">
            Add Food
        </div>


        <!-- MEALS -->

        <label for="savedMeal">
            Meals
        </label>

        <select
            id="savedMeal"
            onchange="mealSelected()"
        >

            <option value="">
                Choose a meal...
            </option>

            <option value="mcdees">
                Mcdees 2x Double Burger
            </option>

            <option value="bigmac">
                Big Mac Meal
            </option>

            <option value="wimpy">
                Wimpy Burger Meal
            </option>

            <option value="usn1">
                USN Choc Caramel 1 Scoop
            </option>

            <option value="usn2">
                USN Choc Caramel 2 Scoop
            </option>

        </select>


        <div
            class="meal-info"
            id="mealInfo"
        ></div>


        <!-- DRINKS -->

        <label for="drink">
            Drinks
        </label>

        <select
            id="drink"
            onchange="drinkSelected()"
        >

            <option value="">
                Choose a drink...
            </option>

            <option value="vodka">
                Single Vodka with Zero Mix
            </option>

            <option value="jager">
                Jägermeister Shot
            </option>

        </select>


        <div
            class="drink-info"
            id="drinkInfo"
        ></div>


        <!-- QUANTITY -->

        <label for="quantity">
            Quantity
        </label>

        <input
            type="number"
            id="quantity"
            value="1"
            min="1"
            step="1"
            inputmode="numeric"
        >


        <!-- DIVIDER -->

        <div class="divider">
            OR ENTER MANUALLY
        </div>


        <!-- MANUAL CALORIES -->

        <label for="calories">
            Calories
        </label>

        <input
            type="number"
            id="calories"
            placeholder="0"
            min="0"
            inputmode="decimal"
        >


        <!-- MANUAL PROTEIN -->

        <label for="protein">
            Protein (g)
        </label>

        <input
            type="number"
            id="protein"
            placeholder="0"
            min="0"
            step="0.1"
            inputmode="decimal"
        >


        <!-- ADD BUTTON -->

        <button
            class="add-button"
            onclick="addFood()"
        >
            + Add Food
        </button>

    </div>


    <!-- TOTALS -->

    <div class="card">

        <div class="card-title">
            Today's Total
        </div>


        <div class="totals">


            <!-- CALORIES -->

            <div class="total-box">

                <div class="total-label">
                    Calories
                </div>

                <div
                    class="total-number"
                    id="totalCalories"
                >
                    0
                </div>

                <span class="total-unit">
                    kcal
                </span>

            </div>


            <!-- PROTEIN -->

            <div class="total-box">

                <div class="total-label">
                    Protein
                </div>

                <div
                    class="total-number protein-number"
                    id="totalProtein"
                >
                    0
                </div>

                <span class="total-unit">
                    g
                </span>

            </div>

        </div>


        <!-- RESET -->

        <button
            class="reset-button"
            onclick="resetDay()"
        >
            Reset Today
        </button>

    </div>


    <div class="footer">
        Stay consistent. 💪
    </div>

</div>


<script>


/* =========================================
   SAVED MEALS
   ========================================= */

const meals = {

    mcdees: {
        name: "Mcdees 2x Double Burger",
        calories: 630,
        protein: 37
    },

    bigmac: {
        name: "Big Mac Meal",
        calories: 650,
        protein: 25
    },

    wimpy: {
        name: "Wimpy Burger Meal",
        calories: 700,
        protein: 30
    },

    usn1: {
        name: "USN Choc Caramel 1 Scoop",
        calories: 121,
        protein: 23
    },

    usn2: {
        name: "USN Choc Caramel 2 Scoop",
        calories: 242,
        protein: 46
    }

};


/* =========================================
   DRINKS
   ========================================= */

const drinks = {

    vodka: {
        name: "Single Vodka with Zero Mix",
        calories: 55,
        protein: 0
    },

    jager: {
        name: "Jägermeister Shot",
        calories: 55,
        protein: 0
    }

};


/* =========================================
   GET TODAY
   ========================================= */

function getToday() {

    const today = new Date();

    return today.getFullYear() + "-" +
        (today.getMonth() + 1) + "-" +
        today.getDate();

}


/* =========================================
   CHECK FOR NEW DAY
   ========================================= */

function checkNewDay() {

    const savedDate =
        localStorage.getItem("date");

    const today =
        getToday();


    if (savedDate !== today) {

        localStorage.setItem(
            "date",
            today
        );

        localStorage.setItem(
            "calories",
            "0"
        );

        localStorage.setItem(
            "protein",
            "0"
        );

    }

}


/* =========================================
   LOAD TOTALS
   ========================================= */

function loadTotals() {

    checkNewDay();


    const calories =
        parseFloat(
            localStorage.getItem("calories")
        ) || 0;


    const protein =
        parseFloat(
            localStorage.getItem("protein")
        ) || 0;


    document.getElementById(
        "totalCalories"
    ).textContent = calories;


    document.getElementById(
        "totalProtein"
    ).textContent = protein;


    document.getElementById(
        "date"
    ).textContent =
        new Date().toLocaleDateString(
            undefined,
            {
                weekday: "long",
                month: "long",
                day: "numeric"
            }
        );

}


/* =========================================
   MEAL SELECTED
   ========================================= */

function mealSelected() {

    const selected =
        document.getElementById(
            "savedMeal"
        ).value;


    const info =
        document.getElementById(
            "mealInfo"
        );


    if (selected === "") {

        info.style.display = "none";

        info.textContent = "";

        return;

    }


    const meal =
        meals[selected];


    info.textContent =
        meal.calories +
        " kcal • " +
        meal.protein +
        "g protein";


    info.style.display =
        "block";


    /* Clear drink */

    document.getElementById(
        "drink"
    ).value = "";


    document.getElementById(
        "drinkInfo"
    ).style.display = "none";


    document.getElementById(
        "drinkInfo"
    ).textContent = "";


    /* Clear manual entry */

    document.getElementById(
        "calories"
    ).value = "";


    document.getElementById(
        "protein"
    ).value = "";

}


/* =========================================
   DRINK SELECTED
   ========================================= */

function drinkSelected() {

    const selected =
        document.getElementById(
            "drink"
        ).value;


    const info =
        document.getElementById(
            "drinkInfo"
        );


    if (selected === "") {

        info.style.display = "none";

        info.textContent = "";

        return;

    }


    const drink =
        drinks[selected];


    info.textContent =
        drink.calories +
        " kcal • " +
        drink.protein +
        "g protein";


    info.style.display =
        "block";


    /* Clear meal */

    document.getElementById(
        "savedMeal"
    ).value = "";


    document.getElementById(
        "mealInfo"
    ).style.display = "none";


    document.getElementById(
        "mealInfo"
    ).textContent = "";


    /* Clear manual entry */

    document.getElementById(
        "calories"
    ).value = "";


    document.getElementById(
        "protein"
    ).value = "";

}


/* =========================================
   ADD FOOD
   ========================================= */

function addFood() {

    checkNewDay();


    const selectedMeal =
        document.getElementById(
            "savedMeal"
        ).value;


    const selectedDrink =
        document.getElementById(
            "drink"
        ).value;


    let calories = 0;

    let protein = 0;


    const quantity =
        parseInt(
            document.getElementById(
                "quantity"
            ).value
        ) || 1;


    /* =====================================
       SAVED MEAL
       ===================================== */

    if (selectedMeal !== "") {

        const meal =
            meals[selectedMeal];


        calories =
            meal.calories * quantity;


        protein =
            meal.protein * quantity;

    }


    /* =====================================
       DRINK
       ===================================== */

    else if (selectedDrink !== "") {

        const drink =
            drinks[selectedDrink];


        calories =
            drink.calories * quantity;


        protein =
            drink.protein * quantity;

    }


    /* =====================================
       MANUAL ENTRY
       ===================================== */

    else {

        calories =
            parseFloat(
                document.getElementById(
                    "calories"
                ).value
            ) || 0;


        protein =
            parseFloat(
                document.getElementById(
                    "protein"
                ).value
            ) || 0;

    }


    /* =====================================
       NOTHING ENTERED
       ===================================== */

    if (
        calories === 0 &&
        protein === 0
    ) {

        alert(
            "Please choose a meal, choose a drink, or enter calories and protein."
        );

        return;

    }


    /* =====================================
       GET CURRENT TOTALS
       ===================================== */

    let totalCalories =
        parseFloat(
            localStorage.getItem(
                "calories"
            )
        ) || 0;


    let totalProtein =
        parseFloat(
            localStorage.getItem(
                "protein"
            )
        ) || 0;


    /* =====================================
       ADD
       ===================================== */

    totalCalories += calories;

    totalProtein += protein;


    /* =====================================
       SAVE
       ===================================== */

    localStorage.setItem(
        "calories",
        totalCalories
    );


    localStorage.setItem(
        "protein",
        totalProtein
    );


    /* =====================================
       CLEAR FORM
       ===================================== */

    document.getElementById(
        "savedMeal"
    ).value = "";


    document.getElementById(
        "drink"
    ).value = "";


    document.getElementById(
        "mealInfo"
    ).style.display = "none";


    document.getElementById(
        "drinkInfo"
    ).style.display = "none";


    document.getElementById(
        "mealInfo"
    ).textContent = "";


    document.getElementById(
        "drinkInfo"
    ).textContent = "";


    document.getElementById(
        "quantity"
    ).value = "1";


    document.getElementById(
        "calories"
    ).value = "";


    document.getElementById(
        "protein"
    ).value = "";


    /* =====================================
       UPDATE SCREEN
       ===================================== */

    loadTotals();

}


/* =========================================
   RESET TODAY
   ========================================= */

function resetDay() {

    if (
        confirm(
            "Reset today's calories and protein?"
        )
    ) {

        localStorage.setItem(
            "calories",
            "0"
        );


        localStorage.setItem(
            "protein",
            "0"
        );


        loadTotals();

    }

}


/* =========================================
   START APP
   ========================================= */

loadTotals();

</script>

</body>
</html>
