<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08080c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Dyl's Six Pack Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #08080c;
            color: white;
        }

        .app {
            width: 100%;
            max-width: 450px;
            margin: auto;
            padding: 45px 20px 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .purple {
            color: #a855f7;
        }

        .date {
            margin-top: 8px;
            color: #888;
            font-size: 15px;
        }

        .card {
            background: #121218;
            border: 1px solid #24242d;
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 18px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 16px;
            margin-bottom: 16px;
            background: #08080c;
            color: white;
            border: 1px solid #30303a;
            border-radius: 12px;
            font-size: 18px;
            outline: none;
        }

        input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.15);
        }

        input::placeholder {
            color: #555;
        }

        .add-button {
            width: 100%;
            padding: 17px;
            border: none;
            border-radius: 12px;
            background: #a855f7;
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }

        .add-button:active {
            transform: scale(0.98);
        }

        .totals {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .total-box {
            background: #08080c;
            border: 1px solid #24242d;
            border-radius: 15px;
            padding: 18px 12px;
            text-align: center;
        }

        .total-label {
            color: #888;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .total-number {
            font-size: 25px;
            font-weight: 800;
        }

        .total-unit {
            font-size: 12px;
            color: #888;
            margin-left: 2px;
        }

        .protein-number {
            color: #c084fc;
        }

        .reset-button {
            width: 100%;
            margin-top: 15px;
            padding: 13px;
            border: 1px solid #30303a;
            border-radius: 12px;
            background: transparent;
            color: #777;
            font-size: 14px;
            cursor: pointer;
        }

        .reset-button:active {
            background: #18181f;
        }

        .footer {
            text-align: center;
            color: #444;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <h1>Dyl's <span class="purple">Six Pack</span> Tracker</h1>
        <div class="date" id="date"></div>
    </div>

    <div class="card">

        <div class="card-title">Add Food</div>

        <label for="calories">Calories</label>

        <input
            type="number"
            id="calories"
            placeholder="0"
            min="0"
            inputmode="decimal"
        >

        <label for="protein">Protein (g)</label>

        <input
            type="number"
            id="protein"
            placeholder="0"
            min="0"
            step="0.1"
            inputmode="decimal"
        >

        <button class="add-button" onclick="addFood()">
            + Add Food
        </button>

    </div>

    <div class="card">

        <div class="card-title">Today's Total</div>

        <div class="totals">

            <div class="total-box">
                <div class="total-label">Calories</div>
                <div class="total-number" id="totalCalories">0</div>
                <span class="total-unit">kcal</span>
            </div>

            <div class="total-box">
                <div class="total-label">Protein</div>
                <div class="total-number protein-number" id="totalProtein">0</div>
                <span class="total-unit">g</span>
            </div>

        </div>

        <button class="reset-button" onclick="resetDay()">
            Reset Today
        </button>

    </div>

    <div class="footer">
        Stay consistent. 💪
    </div>

</div>

<script>

    function getToday() {

        const today = new Date();

        return today.getFullYear() + "-" +
            (today.getMonth() + 1) + "-" +
            today.getDate();
    }

    function checkNewDay() {

        const savedDate = localStorage.getItem("date");
        const today = getToday();

        if (savedDate !== today) {

            localStorage.setItem("date", today);
            localStorage.setItem("calories", "0");
            localStorage.setItem("protein", "0");

        }
    }

    function loadTotals() {

        checkNewDay();

        const calories =
            parseFloat(localStorage.getItem("calories")) || 0;

        const protein =
            parseFloat(localStorage.getItem("protein")) || 0;

        document.getElementById("totalCalories").textContent =
            calories;

        document.getElementById("totalProtein").textContent =
            protein;

        document.getElementById("date").textContent =
            new Date().toLocaleDateString(undefined, {
                weekday: "long",
                month: "long",
                day: "numeric"
            });
    }

    function addFood() {

        checkNewDay();

        const calories =
            parseFloat(document.getElementById("calories").value) || 0;

        const protein =
            parseFloat(document.getElementById("protein").value) || 0;

        let totalCalories =
            parseFloat(localStorage.getItem("calories")) || 0;

        let totalProtein =
            parseFloat(localStorage.getItem("protein")) || 0;

        totalCalories += calories;
        totalProtein += protein;

        localStorage.setItem("calories", totalCalories);
        localStorage.setItem("protein", totalProtein);

        document.getElementById("calories").value = "";
        document.getElementById("protein").value = "";

        loadTotals();
    }

    function resetDay() {

        if (confirm("Reset today's calories and protein?")) {

            localStorage.setItem("calories", "0");
            localStorage.setItem("protein", "0");

            loadTotals();
        }
    }

    loadTotals();

</script>

</body>
</html>
